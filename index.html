<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>John's Sandbox Server</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #202224;
    --surface: #000;
    --text: #fff;
    --text-dim: #bcbcbc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  body { min-height: 100vh; }

  .center {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 96px 24px;
  }
  .cell { width: 100%; max-width: 720px; }
  .panel {
    padding: 12px;
    background: var(--surface);
    border: 1px solid var(--text);
  }
  .eyebrow {
    display: flex; justify-content: space-between; gap: 16px;
    font-size: 16px; line-height: 1.4;
    text-transform: uppercase;
  }
  .eyebrow span:last-child { color: var(--text-dim); text-align: right; }
  h1 {
    margin-top: 8px;
    font-size: 22px; line-height: 1.3; font-weight: 700;
    overflow-wrap: break-word;
  }
  .meta {
    margin-top: 12px;
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    font-size: 16px; line-height: 1.4;
  }
  #status { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pct { flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .bar {
    position: relative;
    height: 8px; margin-top: 12px;
    border: 1px solid var(--text);
  }
  .bar::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to right, transparent 0, transparent calc(10% - 1px), #000 calc(10% - 1px), #000 10%);
  }
  .fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: var(--text);
    transition: width .3s ease-out;
  }
  #file {
    margin-top: 12px; min-height: 22px;
    font-size: 16px; line-height: 1.4; color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  #loading-gif {
    width: min(var(--gif-width, 300px), 100%);
    height: min(var(--gif-height, 150px), 24vh);
    margin: 0 auto 16px;
    overflow: hidden; border-radius: var(--gif-radius, 0px);
    pointer-events: none; background: #000;
  }
  #loading-gif[hidden] { display: none; }
  #loading-gif.framed { border: 1px solid var(--text); }
  #loading-gif img { display: block; width: 100%; height: 100%; object-fit: contain; }
  #loading-gif.below-title { margin-top: 16px; margin-bottom: 0; }

  .server-info {
    display: flex; justify-content: space-between; gap: 24px;
    margin-top: 12px; padding-top: 12px;
    border-top: 1px solid #555;
  }
  .corner { font-size: 16px; line-height: 1.6; color: var(--text-dim); min-width: 0; }
  .corner b { color: var(--text); font-weight: 500; overflow-wrap: anywhere; }
  .corner { visibility: hidden; }
  .corner.on { visibility: visible; }
  .right { text-align: right; }

  #tip {
    position: absolute; top: 24px; left: 24px; right: 24px;
    max-width: 720px; margin: 0 auto; padding: 12px 16px;
    border: 1px solid var(--text); background: var(--surface);
    font-size: 16px; line-height: 1.4;
    transition: opacity .3s ease; opacity: 0;
  }
  #tip.on { opacity: 1; }
  @media (max-width: 480px) {
    .center { padding: 112px 16px 32px; }
    .eyebrow { font-size: 14px; }
    .server-info { flex-direction: column; gap: 8px; }
    .right { text-align: left; }
    #tip { left: 16px; right: 16px; }
  }
  @media (max-height: 600px) {
    .center { padding-top: 24px; padding-bottom: 24px; }
    #tip { position: relative; top: auto; bottom: auto; left: auto; right: auto; width: calc(100% - 48px); margin: 16px auto; }
    .center { min-height: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .fill, #tip { transition: none; }
  }
</style>
</head>
<body>
  <div id="tip"></div>

  <div class="center">
    <div class="cell">
      <div class="panel" id="center-content">
        <div class="eyebrow"><span>Sandbox</span><span>Server connection</span></div>
        <div id="loading-gif" hidden aria-hidden="true"><img id="loading-gif-image" alt=""></div>
        <h1 id="server">John's Sandbox Server</h1>
        <div class="meta"><span id="status">Connecting</span><span id="pct">0%</span></div>
        <div class="bar"><div class="fill" id="fill"></div></div>
        <div id="file"></div>
        <div class="server-info">
          <div class="corner left" id="cl">Map <b id="map"></b> &middot; Gamemode <b id="mode"></b></div>
          <div class="corner right" id="cr">Max players <b id="players"></b></div>
        </div>
      </div>
    </div>
  </div>

<script>
  // ---- edit these ----
  var TIPS = [
    "No server crashing or exploits",
    "Respect fellow players",
    "No degeneracy",
    "Follow Facepunch Studios ToS"
  ];
  var TIP_EVERY_MS = 6000;
  // OPTIONAL GIF SETTINGS — disabled by default, so no GIF is requested.
  // Put your own animated GIF at the configured file path, relative to index.html.
  var GIF_SETTINGS = {
    enabled: false,           // true = show the animation
    file: "images/loading.gif",
    placement: "aboveTitle", // "aboveTitle" or "belowTitle"
    width: 300,               // maximum width in pixels (scales down on small screens)
    height: 150,              // maximum height in pixels (scales down on small screens)
    fit: "contain",          // "contain" (full image) or "cover" (fills frame, may crop)
    opacity: 0.85,            // 0.0–1.0
    framed: true,            // thin white border
    radius: 0                // square corners; increase for rounded corners
  };
  // --------------------

  var total = 0, needed = 0;
  function $(id) { return document.getElementById(id); }

  // Only create a media request when the GIF is explicitly enabled.
  function initOptionalGif() {
    if (!GIF_SETTINGS.enabled || !GIF_SETTINGS.file) return;
    var frame = $("loading-gif");
    var img = $("loading-gif-image");
    var width = Number(GIF_SETTINGS.width);
    var height = Number(GIF_SETTINGS.height);
    var radius = Number(GIF_SETTINGS.radius);
    var opacity = Number(GIF_SETTINGS.opacity);
    frame.style.setProperty("--gif-width", (isFinite(width) && width > 0 ? width : 300) + "px");
    frame.style.setProperty("--gif-height", (isFinite(height) && height > 0 ? height : 150) + "px");
    frame.style.setProperty("--gif-radius", (isFinite(radius) && radius >= 0 ? radius : 0) + "px");
    frame.style.opacity = isFinite(opacity) ? Math.max(0, Math.min(1, opacity)) : 0.85;
    img.style.objectFit = GIF_SETTINGS.fit === "cover" ? "cover" : "contain";
    if (GIF_SETTINGS.framed) frame.classList.add("framed");
    if (GIF_SETTINGS.placement === "belowTitle") {
      frame.classList.add("below-title");
      $("center-content").insertBefore(frame, $("server").nextSibling);
    }
    // A missing GIF should never leave a blank frame on the loading screen.
    img.onerror = function () { frame.hidden = true; img.removeAttribute("src"); };
    img.onload = function () { frame.hidden = false; };
    img.src = GIF_SETTINGS.file;
  }
  initOptionalGif();

  // Called by Garry's Mod
  function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode, volume, language) {
    // server name is set in the HTML, so servername is intentionally ignored
    $("map").textContent = mapname;
    $("mode").textContent = gamemode;
    $("players").textContent = maxplayers;
    $("cl").classList.add("on");
    $("cr").classList.add("on");

  }
  function SetFilesTotal(t) { total = t; updateProgress(); }
  function SetFilesNeeded(n) { needed = n; updateProgress(); }
  function DownloadingFile(name) {
    $("file").textContent = name.split("?")[0];
  }
  function SetStatusChanged(status) {
    $("status").textContent = status;
    if (status.toLowerCase().indexOf("sending client info") !== -1) setPct(100);
  }

  function updateProgress() {
    if (total > 0) setPct(Math.round(((total - needed) / total) * 100));
  }
  function setPct(p) {
    p = Math.max(0, Math.min(100, p));
    $("fill").style.width = p + "%";
    $("pct").textContent = p + "%";
  }

  // rotating tips
  var tipIndex = 0;
  function showTip() {
    var el = $("tip");
    el.classList.remove("on");
    setTimeout(function () {
      el.textContent = TIPS[tipIndex % TIPS.length];
      tipIndex++;
      el.classList.add("on");
    }, 800);
  }
  showTip();
  setInterval(showTip, TIP_EVERY_MS);

</script>
</body>
</html>
