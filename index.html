<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>John's Sandbox Server</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0a0c0b;
    --surface: #111513;
    --sage: #8fa98f;
    --sage-dim: #5f7a62;
    --text: #c8d3c8;
    --text-dim: #7d8a7e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }

  /* atmosphere: drifting sage fog, grain, vignette */
  .fog, .grain, .vignette { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .fog::before, .fog::after {
    content: ""; position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%;
    background: radial-gradient(circle, rgba(95,122,98,.22) 0%, rgba(95,122,98,0) 65%);
    animation: drift 38s ease-in-out infinite alternate;
  }
  .fog::before { top: -25vmax; left: -20vmax; }
  .fog::after  { bottom: -30vmax; right: -20vmax; animation-duration: 52s; animation-direction: alternate-reverse; opacity: .8; }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(14vmax, 8vmax) scale(1.2); }
  }
  .grain {
    opacity: .07;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .vignette { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 35%, rgba(0,0,0,.75) 100%); }

  /* center stack */
  .center {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: table;
  }
  .cell {
    display: table-cell; vertical-align: middle; text-align: center;
    padding: 0 6vw;
  }
  h1 {
    font-size: clamp(36px, 7vw, 92px);
    font-weight: 300;
    color: var(--sage);
    text-shadow: 0 0 40px rgba(143,169,143,.28);
    letter-spacing: .02em;
    opacity: 0;
    animation: arrive 2.4s cubic-bezier(.2,.7,.2,1) .2s forwards;
  }
  @keyframes arrive {
    from { opacity: 0; letter-spacing: .28em; filter: blur(6px); }
    to   { opacity: 1; letter-spacing: .02em; filter: blur(0); }
  }

  .bar {
    position: relative;
    width: min(420px, 60vw); height: 2px; margin-top: 38px;
    background: rgba(143,169,143,.14);
    border-radius: 2px;
  }
  .fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: var(--sage);
    border-radius: 2px;
    box-shadow: 0 0 10px 1px rgba(143,169,143,.7), 0 0 28px 4px rgba(143,169,143,.25);
    transition: width .5s ease-out;
  }
  .meta {
    margin-top: 18px; width: min(420px, 60vw);
    display: flex; justify-content: space-between;
    font-size: 13px; color: var(--text-dim);
  }
  #status { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 12px; }
  #pct { color: var(--sage); font-variant-numeric: tabular-nums; }
  #file {
    margin-top: 10px; width: min(420px, 60vw);
    font-family: Consolas, "Courier New", monospace;
    font-size: 11px; color: var(--sage-dim);
    text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-height: 15px;
  }

  /* corner info */
  .bar, .meta, #file { margin-left: auto; margin-right: auto; }
  .corner {
    position: fixed; bottom: 28px; font-size: 13px; color: var(--text-dim); line-height: 1.6;
  }
  .corner b { color: var(--text); font-weight: 400; }
  .corner { opacity: 0; transition: opacity 1s ease; }
  .corner.on { opacity: 1; }
  .left { left: 32px; }
  .right { right: 32px; text-align: right; }

  /* rotating tips */
  #tip {
    position: fixed; top: 32px; left: 0; right: 0; text-align: center;
    font-size: 13px; color: var(--text-dim);
    transition: opacity .8s ease; opacity: 0;
  }
  #tip.on { opacity: 1; }

  /* music toggle */
  #snd, #nxt {
    position: fixed; top: 24px; right: 32px;
    width: 36px; height: 36px; padding: 0;
    background: transparent; color: var(--sage);
    border: 1px solid rgba(143,169,143,.28); border-radius: 50%;
    cursor: pointer; opacity: 0; transition: opacity .6s ease, border-color .2s ease;
  }
  #snd.on, #nxt.on { opacity: .85; }
  #snd:hover, #nxt:hover { border-color: var(--sage); }
  #snd svg, #nxt svg { width: 18px; height: 18px; display: block; margin: 0 auto; }
  #nxt { right: 76px; }
  #vol {
    position: fixed; top: 33px; right: 76px; width: 90px; height: 18px; margin: 0;
    -webkit-appearance: none; appearance: none; background: transparent;
    cursor: pointer; opacity: 0; transition: opacity .6s ease;
  }
  #nxt.on + #vol { right: 124px; }
  #vol.on { opacity: .85; }
  #vol:focus { outline: none; }
  #vol::-webkit-slider-runnable-track { height: 2px; background: rgba(143,169,143,.28); border-radius: 2px; }
  #vol::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px;
    border-radius: 50%; background: var(--sage); box-shadow: 0 0 8px rgba(143,169,143,.6);
  }
  #np {
    position: fixed; top: 68px; right: 32px; max-width: 40%; text-align: right;
    font-size: 12px; color: var(--text-dim);
    opacity: 0; transition: opacity .8s ease;
  }
  #np.on { opacity: 1; }
  #snd .slash { display: none; }
  #snd.muted .waves { display: none; }
  #snd.muted .slash { display: inline; }

  @media (prefers-reduced-motion: reduce) {
    .fog::before, .fog::after { animation: none; }
    h1 { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
  <div class="fog"></div>
  <div class="grain"></div>
  <div class="vignette"></div>

  <div id="tip"></div>

  <div class="center"><div class="cell">
    <h1 id="server">John's Sandbox Server</h1>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="meta"><span id="status">Connecting</span><span id="pct">0%</span></div>
    <div id="file"></div>
  </div></div>

  <button id="nxt" type="button" title="Next track" aria-label="Next track">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 5l9 7-9 7V5z"/><path d="M18 5v14"/>
    </svg>
  </button>
  <input id="vol" type="range" min="0" max="100" value="50" title="Music volume" aria-label="Music volume">
  <div id="np"></div>
  <button id="snd" type="button" title="Toggle music" aria-label="Toggle music">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9v6h4l5 4V5L8 9H4z"/>
      <path class="waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
      <path class="slash" d="M17 9l5 6M22 9l-5 6"/>
    </svg>
  </button>

  <div class="corner left" id="cl">Map <b id="map"></b><br>Gamemode <b id="mode"></b></div>
  <div class="corner right" id="cr">Max players <b id="players"></b></div>

<script>
  // ---- edit these ----
  var TIPS = [
    "No server crashing or exploits",
    "Respect fellow players",
    "No degeneracy",
    "Follow Facepunch Studios ToS"
  ];
  var TIP_EVERY_MS = 6000;
  // music: put the files next to this html file. Add as many tracks as you like.
  // Order is shuffled each time. "title" is optional; without it the file name is shown.
  var MUSIC = [
    { file: "background_music/Vaporwave_quiet.opus", title: "" }
  ];
  var MUSIC_VOLUME = 0.1;  // loudest the music gets (0 to 1). Scaled by each player's own Music Volume setting
  // --------------------

  var total = 0, needed = 0;
  var userVolume = 1, gain = 1, fading = false, audio = null;
  function applyVolume() {
    if (audio && !fading) audio.volume = Math.min(1, MUSIC_VOLUME * userVolume * gain);
  }
  function $(id) { return document.getElementById(id); }

  // Called by Garry's Mod
  function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode, volume, language) {
    // server name is set in the HTML, so servername is intentionally ignored
    $("map").textContent = mapname;
    $("mode").textContent = gamemode;
    $("players").textContent = maxplayers;
    $("cl").classList.add("on");
    $("cr").classList.add("on");
    // Gmod passes the player's own Music Volume setting (0 to 1); scale the music by it
    var v = parseFloat(volume);
    if (!isNaN(v)) {
      userVolume = Math.max(0, Math.min(1, v));
      applyVolume();
    }
  }
  function SetFilesTotal(t) { total = t; updateProgress(); }
  function SetFilesNeeded(n) { needed = n; updateProgress(); }
  function DownloadingFile(name) {
    $("file").textContent = name.split("?")[0];
  }
  function SetStatusChanged(status) {
    $("status").textContent = status;
    if (status.toLowerCase().indexOf("sending client info") !== -1) setPct(100);
  }

  function updateProgress() {
    if (total > 0) setPct(Math.round(((total - needed) / total) * 100));
  }
  function setPct(p) {
    p = Math.max(0, Math.min(100, p));
    $("fill").style.width = p + "%";
    $("pct").textContent = p + "%";
  }

  // rotating tips
  var tipIndex = 0;
  function showTip() {
    var el = $("tip");
    el.classList.remove("on");
    setTimeout(function () {
      el.textContent = TIPS[tipIndex % TIPS.length];
      tipIndex++;
      el.classList.add("on");
    }, 800);
  }
  showTip();
  setInterval(showTip, TIP_EVERY_MS);

  // background music
  var order = [], pos = 0, fadeTimer = null, npTimer = null;
  var failures = 0, firstLoad = true;
  var sndBtn = $("snd"), nxtBtn = $("nxt"), npEl = $("np"), volEl = $("vol");
  // slider: middle is the default level, left is silent, right is double
  volEl.addEventListener("input", function () { gain = volEl.value / 50; applyVolume(); });

  function shuffle() {
    order = [];
    for (var i = 0; i < MUSIC.length; i++) order.push(i);
    for (var j = order.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var t = order[j]; order[j] = order[k]; order[k] = t;
    }
  }
  function fadeIn() {
    var v = 0;
    clearInterval(fadeTimer);
    fading = true;
    audio.volume = 0;
    fadeTimer = setInterval(function () {
      var target = Math.min(1, MUSIC_VOLUME * userVolume * gain);
      v += MUSIC_VOLUME / 30;
      if (v >= target) { v = target; clearInterval(fadeTimer); fading = false; }
      audio.volume = v;
    }, 100);
  }
  // no title given? build one from the file name
  function prettyName(path) {
    var n = path.split("/").pop().replace(/\.[^.]+$/, "");
    try { n = decodeURIComponent(n); } catch (e) {}
    return n.replace(/[-_]+/g, " ");
  }
  function showNowPlaying(title) {
    if (!title) return;
    npEl.textContent = title;
    npEl.classList.add("on");
    clearTimeout(npTimer);
    npTimer = setTimeout(function () { npEl.classList.remove("on"); }, 6000);
  }
  function playCurrent() {
    var track = MUSIC[order[pos]];
    audio.src = encodeURI(track.file);
    var p = audio.play();
    if (p && p.catch) p.catch(function () { sndBtn.classList.add("muted"); });
    showNowPlaying(track.title || prettyName(track.file));
  }
  function nextTrack() {
    pos++;
    if (pos >= order.length) { shuffle(); pos = 0; }
    playCurrent();
  }

  if (MUSIC.length > 0) {
    shuffle();
    audio = new Audio();
    audio.addEventListener("ended", nextTrack);
    audio.addEventListener("playing", function () { sndBtn.classList.remove("muted"); });
    audio.addEventListener("loadedmetadata", function () {
      // very long files (mixes): start somewhere random so it isn't always the intro
      if (firstLoad && audio.duration > 600) {
        audio.currentTime = Math.random() * (audio.duration - 300);
      }
      firstLoad = false;
    });
    audio.addEventListener("canplay", function () {
      failures = 0;
      sndBtn.classList.add("on");
      volEl.classList.add("on");
      if (MUSIC.length > 1) nxtBtn.classList.add("on");
    });
    audio.addEventListener("error", function () {
      failures++;
      if (failures <= MUSIC.length) nextTrack();
      else { sndBtn.classList.remove("on"); nxtBtn.classList.remove("on"); volEl.classList.remove("on"); }
    });
    playCurrent();
    fadeIn();

    sndBtn.addEventListener("click", function () {
      if (audio.paused) {
        audio.play();
        fadeIn();
        sndBtn.classList.remove("muted");
      } else {
        audio.pause();
        sndBtn.classList.add("muted");
      }
    });
    nxtBtn.addEventListener("click", function () {
      var wasPaused = audio.paused;
      nextTrack();
      if (wasPaused) fadeIn();
      sndBtn.classList.remove("muted");
    });
  }
</script>
</body>
</html>
