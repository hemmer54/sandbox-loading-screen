<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>John's Sandbox Server</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0a0c0b;
    --surface: #111513;
    --sage: #8fa98f;
    --sage-dim: #5f7a62;
    --text: #c8d3c8;
    --text-dim: #7d8a7e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }

  /* atmosphere: drifting sage fog, grain, vignette */
  .fog, .grain, .vignette { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .fog::before, .fog::after {
    content: ""; position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%;
    background: radial-gradient(circle, rgba(95,122,98,.22) 0%, rgba(95,122,98,0) 65%);
    animation: drift 38s ease-in-out infinite alternate;
  }
  .fog::before { top: -25vmax; left: -20vmax; }
  .fog::after  { bottom: -30vmax; right: -20vmax; animation-duration: 52s; animation-direction: alternate-reverse; opacity: .8; }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(14vmax, 8vmax) scale(1.2); }
  }
  .grain {
    opacity: .07;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .vignette { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 35%, rgba(0,0,0,.75) 100%); }

  /* center stack */
  .center {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: table;
  }
  .cell {
    display: table-cell; vertical-align: middle; text-align: center;
    padding: 0 6vw;
  }
  h1 {
    font-size: clamp(36px, 7vw, 92px);
    font-weight: 300;
    color: var(--sage);
    text-shadow: 0 0 40px rgba(143,169,143,.28);
    letter-spacing: .02em;
    opacity: 0;
    animation: arrive 2.4s cubic-bezier(.2,.7,.2,1) .2s forwards;
  }
  @keyframes arrive {
    from { opacity: 0; letter-spacing: .28em; filter: blur(6px); }
    to   { opacity: 1; letter-spacing: .02em; filter: blur(0); }
  }

  .bar {
    position: relative;
    width: min(420px, 60vw); height: 2px; margin-top: 38px;
    background: rgba(143,169,143,.14);
    border-radius: 2px;
  }
  .fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: var(--sage);
    border-radius: 2px;
    box-shadow: 0 0 10px 1px rgba(143,169,143,.7), 0 0 28px 4px rgba(143,169,143,.25);
    transition: width .5s ease-out;
  }
  .meta {
    margin-top: 18px; width: min(420px, 60vw);
    display: flex; justify-content: space-between;
    font-size: 13px; color: var(--text-dim);
  }
  #status { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 12px; }
  #pct { color: var(--sage); font-variant-numeric: tabular-nums; }
  #file {
    margin-top: 10px; width: min(420px, 60vw);
    font-family: Consolas, "Courier New", monospace;
    font-size: 11px; color: var(--sage-dim);
    text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-height: 15px;
  }

  /* corner info */
  .bar, .meta, #file { margin-left: auto; margin-right: auto; }
  .corner {
    position: fixed; bottom: 28px; font-size: 13px; color: var(--text-dim); line-height: 1.6;
  }
  .corner b { color: var(--text); font-weight: 400; }
  .corner { opacity: 0; transition: opacity 1s ease; }
  .corner.on { opacity: 1; }
  .left { left: 32px; }
  .right { right: 32px; text-align: right; }

  /* rotating tips */
  #tip {
    position: fixed; top: 32px; left: 0; right: 0; text-align: center;
    font-size: 13px; color: var(--text-dim);
    transition: opacity .8s ease; opacity: 0;
  }
  #tip.on { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .fog::before, .fog::after { animation: none; }
    h1 { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
  <div class="fog"></div>
  <div class="grain"></div>
  <div class="vignette"></div>

  <div id="tip"></div>

  <div class="center"><div class="cell">
    <h1 id="server">John's Sandbox Server</h1>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="meta"><span id="status">Connecting</span><span id="pct">0%</span></div>
    <div id="file"></div>
  </div></div>

  <div class="corner left" id="cl">Map <b id="map"></b><br>Gamemode <b id="mode"></b></div>
  <div class="corner right" id="cr">Max players <b id="players"></b></div>

<script>
  // ---- edit these ----
  var TIPS = [
    "No server crashing or exploits",
    "Respect fellow players",
    "No degeneracy",
    "Follow Facepunch Studios ToS"
  ];
  var TIP_EVERY_MS = 6000;
  // music on/off: set to false for a regular silent loading screen (no controls shown)
  var MUSIC_ENABLED = true;

  // Audio paths are relative to this HTML file. Add more tracks if desired.
  // Filenames and capitalization must match the files hosted on GitHub Pages.
  var MUSIC = [
    { file: "background_music/backround_song.opus" }
  ];
  var MUSIC_VOLUME = 0.3;  // 0–1; also scaled by the player's in-game Music Volume
  // --------------------

  var total = 0, needed = 0;
  var userVolume = 1, fading = false, audio = null, fadeTimer = null;
  function applyVolume() {
    if (audio && !fading) audio.volume = Math.min(1, MUSIC_VOLUME * userVolume);
  }
  function $(id) { return document.getElementById(id); }

  // Called by Garry's Mod
  function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode, volume, language) {
    // server name is set in the HTML, so servername is intentionally ignored
    $("map").textContent = mapname;
    $("mode").textContent = gamemode;
    $("players").textContent = maxplayers;
    $("cl").classList.add("on");
    $("cr").classList.add("on");
    // Gmod passes the player's own Music Volume setting (0 to 1); scale the music by it
    var v = parseFloat(volume);
    if (!isNaN(v)) {
      userVolume = Math.max(0, Math.min(1, v));
      applyVolume();
    }
  }
  function SetFilesTotal(t) { total = t; updateProgress(); }
  function SetFilesNeeded(n) { needed = n; updateProgress(); }
  function DownloadingFile(name) {
    $("file").textContent = name.split("?")[0];
  }
  function SetStatusChanged(status) {
    $("status").textContent = status;
    if (status.toLowerCase().indexOf("sending client info") !== -1) setPct(100);
  }

  function updateProgress() {
    if (total > 0) setPct(Math.round(((total - needed) / total) * 100));
  }
  function setPct(p) {
    p = Math.max(0, Math.min(100, p));
    $("fill").style.width = p + "%";
    $("pct").textContent = p + "%";
  }

  // rotating tips
  var tipIndex = 0;
  function showTip() {
    var el = $("tip");
    el.classList.remove("on");
    setTimeout(function () {
      el.textContent = TIPS[tipIndex % TIPS.length];
      tipIndex++;
      el.classList.add("on");
    }, 800);
  }
  showTip();
  setInterval(showTip, TIP_EVERY_MS);

  // Background music. No track-name display or permanent on-screen controls.
  var order = [], pos = 0, failures = 0, firstLoad = true;
  var attemptId = 0, attemptFailed = false, waitingForGesture = false;

  function shuffle() {
    order = [];
    for (var i = 0; i < MUSIC.length; i++) order.push(i);
    for (var j = order.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var t = order[j]; order[j] = order[k]; order[k] = t;
    }
  }

  function fadeIn() {
    clearInterval(fadeTimer);
    fading = true;
    var elapsed = 0;
    audio.volume = 0;
    fadeTimer = setInterval(function () {
      if (audio.paused) {
        clearInterval(fadeTimer);
        fading = false;
        return;
      }
      elapsed += 100;
      var target = Math.min(1, MUSIC_VOLUME * userVolume);
      audio.volume = target * Math.min(1, elapsed / 3000);
      if (elapsed >= 3000) {
        clearInterval(fadeTimer);
        fading = false;
        applyVolume();
      }
    }, 100);
  }

  function nextTrack() {
    pos++;
    if (pos >= order.length) { shuffle(); pos = 0; }
    playCurrent();
  }

  function failTrack(reason) {
    // A bad URL can trigger both an error event and a rejected play() promise.
    // Count it only once so a single broken track cannot skip the whole playlist.
    if (attemptFailed) return;
    attemptFailed = true;
    failures++;
    if (failures < MUSIC.length) nextTrack();
  }

  function tryPlay() {
    var id = attemptId;
    try {
      var result = audio.play();
      if (result && typeof result.catch === "function") {
        result.catch(function (err) {
          // Ignore rejections from a previous track after src was changed.
          if (id !== attemptId || attemptFailed) return;
          if (err && err.name === "NotAllowedError") {
            waitingForGesture = true;
          } else if (!err || err.name !== "AbortError") {
            failTrack(err);
          }
        });
      }
    } catch (err) {
      if (err && err.name === "NotAllowedError") {
        waitingForGesture = true;
      } else {
        failTrack(err);
      }
    }
  }

  function playCurrent() {
    if (!audio || !order.length) return;
    attemptId++;
    attemptFailed = false;
    waitingForGesture = false;
    clearInterval(fadeTimer);
    fading = false;
    audio.volume = 0;
    audio.src = encodeURI(MUSIC[order[pos]].file);
    tryPlay();
  }

  // Only needed in browsers that refuse sound until a real user gesture.
  function resumeOnInteraction() {
    if (!waitingForGesture || !audio) return;
    waitingForGesture = false;
    tryPlay();
  }
  document.addEventListener("click", resumeOnInteraction);
  document.addEventListener("keydown", resumeOnInteraction);

  if (MUSIC_ENABLED && MUSIC.length > 0) {
    shuffle();
    audio = new Audio();
    audio.preload = "auto";
    audio.addEventListener("ended", nextTrack);
    audio.addEventListener("loadedmetadata", function () {
      // For long mixes, avoid replaying the same intro on every connection.
      if (firstLoad && isFinite(audio.duration) && audio.duration > 600) {
        audio.currentTime = Math.random() * (audio.duration - 300);
      }
      firstLoad = false;
    });
    audio.addEventListener("playing", function () {
      failures = 0;
      waitingForGesture = false;
      fadeIn();
    });
    audio.addEventListener("error", function () {
      var code = audio.error ? audio.error.code : "unknown";
      failTrack("Media error code " + code + " (code 4 often means missing file or unsupported format)");
    });
    playCurrent();
  }
</script>
</body>
</html>
